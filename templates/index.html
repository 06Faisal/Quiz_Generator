<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Generator — Multiple-choice questions on any topic</title>
    <meta name="description" content="Write a topic, get a set of multiple-choice questions with the answers already marked.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <header class="masthead">
            <h1 class="masthead-title">Quiz Generator</h1>
            <dl class="docket">
                <div><dt>Sheet</dt><dd id="docket-sheet">—</dd></div>
                <div><dt>Marked</dt><dd>by machine</dd></div>
            </dl>
        </header>

        <section class="lede">
            <p class="eyebrow">Answer key included</p>
            <h2>Every question comes back<br>already marked.</h2>
            <p class="standfirst">Name a topic and get a set of multiple-choice questions with the correct option ticked and a one-line reason for it. Nothing to grade afterwards.</p>
        </section>

        <section class="composer" id="input-panel">
            <div class="field field-topic">
                <label for="topic">Topic</label>
                <input type="text" id="topic" placeholder="Photosynthesis · Python loops · The Mughal Empire" autocomplete="off">
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="num-questions">Questions <span class="slider-value" id="slider-value">5</span></label>
                    <input type="range" id="num-questions" min="1" max="20" value="5" class="slider">
                    <div class="slider-labels"><span>1</span><span>20</span></div>
                </div>

                <div class="field">
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>

            <button id="generate-btn" type="button">
                <span class="btn-text">Set the paper</span>
                <span class="btn-loader is-hidden"><span class="spinner"></span>Writing questions…</span>
            </button>
        </section>

        <div class="error-toast is-hidden" id="error-toast" role="alert" aria-live="polite">
            <span id="error-message"></span>
        </div>

        <section class="results" id="results"></section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
