<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator — Generate MCQs Instantly</title>
    <meta name="description" content="Generate multiple choice questions on any topic using AI. Intelligent, high-quality quiz generation.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Animated background orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                </div>
                <h1>AI Quiz Generator</h1>
            </div>
            <p class="subtitle">Generate intelligent MCQs on any topic in seconds</p>
        </header>

        <!-- Input Panel -->
        <section class="input-panel glass-card" id="input-panel">
            <div class="input-group">
                <label for="topic" class="input-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    Topic
                </label>
                <input type="text" id="topic" placeholder="e.g. Python Programming Loops, Photosynthesis, Indian History..." autocomplete="off">
            </div>

            <div class="input-row">
                <div class="input-group flex-1">
                    <label for="num-questions" class="input-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                        </svg>
                        Number of Questions
                        <span class="slider-value" id="slider-value">5</span>
                    </label>
                    <input type="range" id="num-questions" min="1" max="20" value="5" class="slider">
                    <div class="slider-labels">
                        <span>1</span>
                        <span>20</span>
                    </div>
                </div>

                <div class="input-group flex-1">
                    <label for="difficulty" class="input-label">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        Difficulty
                    </label>
                    <select id="difficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>

            <button id="generate-btn" onclick="generateQuiz()">
                <span class="btn-text">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    Generate Quiz
                </span>
                <span class="btn-loader" style="display:none;">
                    <div class="spinner"></div>
                    Generating...
                </span>
            </button>
        </section>

        <!-- Error message -->
        <div class="error-toast" id="error-toast" style="display:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>
            </svg>
            <span id="error-message"></span>
        </div>

        <!-- Results Area -->
        <section class="results" id="results"></section>


    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
